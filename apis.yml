name: AAZZUR
description: >-
  AAZZUR is a Berlin-based embedded finance and Banking-as-a-Service (BaaS)
  platform that lets enterprises, financial institutions, and startups embed
  financial services into their own products. It provides modular "Smart Finance
  Blocks" (pre-configured front-end screens, micro-services, and connections to
  underlying API providers) alongside its own developer-portal APIs and a smart
  marketplace of BaaS and fintech partners. Customers can consume the APIs
  directly, drop in AAZZUR's embeddable front-end components, or launch
  stand-alone apps and web frontends covering banking, payments, cards, lending,
  wealth management, and insurance without building the underlying financial
  infrastructure themselves.
